# Render Blueprint — creates the database, API and frontend in one go.
# Dashboard > New > Blueprint > pick this repo. Fill in the `sync: false` secrets.
databases:
  - name: bazunk-db
    plan: free            # free DBs expire after 30 days — use "basic-256mb" for real use
    databaseName: bazunk
    user: bazunk

services:
  # ── Backend ────────────────────────────────────────────────────────────────
  - type: web
    name: bazunk-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile --prod=false && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: bazunk-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL         # the frontend URL
        value: https://bazunk-web.onrender.com
      - key: PUBLIC_API_URL          # this API's own URL (Didit webhook)
        sync: false
      - key: CORS_ORIGINS
        value: https://bazunk-web.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RAPIDAPI_KEY          # importers (Amazon / eBay / AliExpress) — or paste it in Admin > Imports
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLERK_SECRET_KEY        # optional — nothing server-side requires it
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # Optional integrations (set only the ones you use):
      #   LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET
      #   DIDIT_CLIENT_ID, DIDIT_CLIENT_SECRET, DIDIT_WEBHOOK_SECRET, DIDIT_BASE_URL

  # ── Frontend (static) ──────────────────────────────────────────────────────
  - type: web
    name: bazunk-web
    runtime: static
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile --prod=false && pnpm --filter @workspace/sellbuydeal run build
    staticPublishPath: artifacts/sellbuydeal/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: BASE_PATH
        value: /
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL            # e.g. https://bazunk-api.onrender.com  (no trailing slash)
        sync: false
    routes:
      - type: rewrite                # SPA fallback so /listing/123 etc. work on refresh
        source: /*
        destination: /index.html
